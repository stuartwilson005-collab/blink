name: BlinkControl
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  BlinkCore:
    path: .
targets:
  BlinkControl:
    type: application
    platform: iOS
    sources: [BlinkApp]
    dependencies:
      - package: BlinkCore
      - target: BlinkControlWatch
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.stuartwilson.blinkcontrol
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blink Control
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  BlinkControlWatch:
    type: application
    platform: watchOS
    sources: [BlinkWatch]
    dependencies:
      - package: BlinkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stuartwilson.blinkcontrol.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blink Control
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.stuartwilson.blinkcontrol
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  BlinkControlWatch:
    build:
      targets:
        BlinkControlWatch: all
    run:
      config: Debug
  BlinkControl:
    build:
      targets:
        BlinkControl: all
    run:
      config: Debug
