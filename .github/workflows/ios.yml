name: Swift and iOS
on: [push, pull_request]
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS simulator app
        run: xcodebuild -project BlinkControl.xcodeproj -scheme BlinkControl -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
